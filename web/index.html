<title>Lexicomètre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: one narrow column like a phone screen; the quiz card is set like a dictionary entry. */
:root {
  --bg: #f5f3fa; --surface: #ffffff; --surface-2: #efebf8; --ink: #1d1932; --muted: #6c6787; --line: #e3ddf0;
  --accent: #5b45e8; --accent-2: #b23fd3; --accent-soft: #ece8fd; --on-accent: #ffffff;
  --flame: #e8640f; --flame-soft: #fdeee3; --good: #1f9d57; --good-soft: #e3f4ea; --bad: #d93a45; --bad-soft: #fbe7e8;
  --shadow: 0 10px 30px rgba(60, 40, 140, .10);
  --display: 'Literata', Georgia, 'Times New Roman', serif;
  --ui: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121019; --surface: #1c1928; --surface-2: #252136; --ink: #f2effb; --muted: #a49ebd; --line: #302a45;
    --accent: #8e7dff; --accent-2: #d46df0; --accent-soft: #272044; --on-accent: #ffffff;
    --flame: #ff8a45; --flame-soft: #36231a; --good: #3dcb7a; --good-soft: #153222; --bad: #ff6b73; --bad-soft: #3a1a1e;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121019; --surface: #1c1928; --surface-2: #252136; --ink: #f2effb; --muted: #a49ebd; --line: #302a45;
  --accent: #8e7dff; --accent-2: #d46df0; --accent-soft: #272044; --on-accent: #ffffff;
  --flame: #ff8a45; --flame-soft: #36231a; --good: #3dcb7a; --good-soft: #153222; --bad: #ff6b73; --bad-soft: #3a1a1e;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 28px; min-height: 100%; display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.flame { background: var(--flame-soft); color: var(--flame); }
.pill.soft { background: var(--accent-soft); color: var(--accent); }
.flame-icon { width: 14px; height: 14px; fill: currentColor; }

.hero { border-radius: 26px; padding: 22px; color: var(--on-accent); background: radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.18), transparent 55%), linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; opacity: .8; }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 7vw, 32px); line-height: 1.1; text-wrap: balance; }
.hero p { margin: 0; opacity: .9; }
.big { font-size: clamp(44px, 13vw, 58px); font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 20px; font-weight: 500; letter-spacing: 0; margin-left: 6px; opacity: .9; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: rgba(255,255,255,.18); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.btn { border: 0; border-radius: 16px; padding: 14px 16px; font-weight: 600; font-size: 15px; transition: transform .12s ease, background .2s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.white { background: #fff; color: #4a36d6; }
.btn.ghost { background: rgba(255,255,255,.18); color: var(--on-accent); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); width: 100%; box-shadow: 0 6px 18px rgba(91,69,232,.28); }
.btn.secondary { background: var(--accent-soft); color: var(--accent); width: 100%; }

.section-title { font-weight: 600; font-size: 17px; margin: 6px 2px 0; }
.modes { display: grid; gap: 10px; }
.mode { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; transition: transform .12s ease; }
.mode:active { transform: scale(.98); }
.mode .ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none; }
.mode .ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mode b { display: block; font-weight: 600; color: var(--ink); }
.mode .txt > span { color: var(--muted); font-size: 13.5px; }
.mode .txt { flex: 1; min-width: 0; }
.mode:disabled { opacity: .55; cursor: default; }
.mode .tag { background: var(--good-soft); color: var(--good); border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 600; }
.g1 { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.g2 { background: linear-gradient(135deg, #ff9f33, #f24e6b); }
.g3 { background: linear-gradient(135deg, #22b39c, #3478eb); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.wotd .head { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; }
.wotd .head b { color: var(--accent); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
.headword { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; }
.gram { font-family: var(--display); font-style: italic; color: var(--muted); font-weight: 400; }
.wotd .headword { font-size: 26px; margin: 6px 0 2px; }
.wotd p { margin: 6px 0 0; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 4px; }
.foot a { color: var(--accent); }

/* Quiz */
.quizbar { display: flex; align-items: center; gap: 12px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--surface); color: var(--muted); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
.progress { flex: 1; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; }
.track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }
.track.hot i { background: linear-gradient(90deg, #ff9f33, #f24e6b); transition: width .1s linear; }
.live { align-self: center; }
.entry { background: var(--surface); border-radius: 26px; padding: 26px 18px 20px; text-align: center; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.entry .headword { font-size: clamp(30px, 9vw, 42px); line-height: 1.1; overflow-wrap: anywhere; }
.entry .gram { font-size: 17px; }
.rarity { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 500; }
.rarity span { display: flex; gap: 3px; }
.rarity i { width: 14px; height: 5px; border-radius: 9px; background: var(--surface-2); }
.rarity i.on { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.options { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px; line-height: 1.4; transition: transform .12s ease, opacity .2s, background .2s, border-color .2s; }
.opt:active { transform: scale(.985); }
.opt .l { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--accent-soft); color: var(--accent); }
.opt .d { flex: 1; min-width: 0; padding-top: 3px; }
.opt.good { border-color: var(--good); background: var(--good-soft); }
.opt.good .l { background: var(--good); color: #fff; }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .45s; }
.opt.bad .l { background: var(--bad); color: #fff; }
.opt.dim { opacity: .45; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-7px) } 40%,80% { transform: translateX(7px) } }
.feedback { display: flex; flex-direction: column; gap: 8px; }
.feedback .t { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
.feedback .t .xp { margin-left: auto; color: var(--flame); font-size: 14px; }
.feedback .m { color: var(--muted); font-size: 14px; margin: 0; }
.feedback .ex { font-family: var(--display); font-style: italic; background: var(--accent-soft); border-radius: 14px; padding: 12px; margin: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.bottom { position: sticky; bottom: 0; padding-block: 10px calc(18px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: auto; }
/* same spot whether the bar sits at the end of the page or sticks to the screen edge */
.app:has(> .bottom) { padding-block-end: 0; }
.hint { color: var(--muted); font-size: 12px; text-align: center; margin: 0 0 8px; }
.next-btn { animation: next-in .22s ease-out; }
@keyframes next-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* Result */
.result-hero { text-align: center; align-items: center; }
.interval { font-size: 13px; opacity: .85; }
.titlecard { display: flex; gap: 14px; align-items: center; }
.medal { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #ff9f33, #f24e6b); display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 700; font-size: 22px; flex: none; }
.titlecard b { font-size: 18px; display: block; }
.titlecard span { color: var(--muted); font-size: 14px; }
.ringrow { display: flex; gap: 16px; align-items: center; }
.ringrow svg { flex: none; }
.bench { display: grid; gap: 8px; }
.scale { position: relative; height: 22px; margin-bottom: 4px; }
.scale .base { position: absolute; top: 6px; left: 0; right: 0; height: 10px; border-radius: 9px; background: var(--surface-2); }
.scale .fill { position: absolute; top: 6px; left: 0; height: 10px; border-radius: 9px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.scale .tick { position: absolute; top: 2px; width: 2px; height: 18px; background: var(--muted); opacity: .45; }
.scale .you { position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 4px solid var(--accent); margin-left: -9px; }
.bench .b { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.bench .b.ok { color: var(--ink); }
.bench .b .check { color: var(--good); font-weight: 700; display: inline-block; width: 1.2em; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.missed { display: grid; gap: 10px; }
.missed div { border-top: 1px solid var(--line); padding-top: 10px; }
.missed div:first-child { border-top: 0; padding-top: 0; }
.missed .headword { font-size: 18px; }
.missed p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.grid10 { font-size: 26px; letter-spacing: 2px; text-align: center; }
.center { text-align: center; }
.muted { color: var(--muted); }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -160%); opacity: 0; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 16px; font-weight: 600; transition: transform .35s ease, opacity .35s ease; z-index: 20; max-width: calc(100% - 32px); pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
.loading { opacity: .8; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<canvas id="confetti" hidden></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="app" id="app"></div>

<script src="lexicore.js"></script>
<script>
(function () {
  'use strict';
  const L = window.Lexi;
  const app = document.getElementById('app');
  const FR = new Intl.NumberFormat('fr-FR');
  const fmt = (n) => FR.format(n);
  const pct = (x) => Math.round(x * 100) + ' %';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const FLAME = '<svg class="flame-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.2-.6 5-2.3 6.8C8 10.6 6 12.6 6 15.6A6 6 0 0 0 12 22a6 6 0 0 0 6-6.2c0-2.6-1.3-4.3-2.6-5.6.1 1.6-.5 2.8-1.6 3.4.4-3.9-1-8.3-1.8-11.6Z"/></svg>';
  const ICONS = {
    inf: '<svg viewBox="0 0 24 24"><path d="M7.5 15.5c-2 0-3.5-1.6-3.5-3.5s1.5-3.5 3.5-3.5c3.5 0 5.5 7 9 7 2 0 3.5-1.6 3.5-3.5s-1.5-3.5-3.5-3.5c-3.5 0-5.5 7-9 7"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M10 2.5h4"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  };

  // ---------- Saved progress (this browser only) ----------
  const KEY = 'lexicometre-web-v1';
  function load() {
    try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return blank(); }
  }
  function blank() { return { profile: null, responses: [], seen: [], bestStreak: 0, chronoBest: 0, daily: {}, dayStreak: 0, lastDay: null, xp: 0 }; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: progress lasts for this visit */ } }
  const S = load();
  let bank = null, est = null, seen = new Set(S.seen);

  function rebuild() {
    est = new L.Estimator(bank, S.profile || 'unspecified');
    for (const [b, o] of S.responses) est.add(b, o);
  }
  function estimate() { return est && est.answered > 0 ? est.estimate() : null; }
  function dayStreak() {
    if (!S.lastDay) return 0;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    return S.lastDay === today() || S.lastDay === ys ? S.dayStreak : 0;
  }
  function touchDay() {
    const t = today();
    if (S.lastDay === t) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    S.dayStreak = S.lastDay === ys ? S.dayStreak + 1 : 1;
    S.lastDay = t;
  }

  // ---------- Toast & confetti ----------
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('confetti'), ctx = c.getContext('2d');
    c.hidden = false; c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    const colors = ['#5b45e8', '#b23fd3', '#ff9f33', '#1f9d57', '#f7c843', '#3a8bf2'];
    const P = Array.from({ length: 110 }, () => ({ x: Math.random(), d: Math.random() * .6, v: .55 + Math.random() * .55, w: 2 + Math.random() * 3, s: (Math.random() - .5) * 12, dr: (Math.random() - .5) * 80, c: colors[Math.floor(Math.random() * colors.length)] }));
    const t0 = performance.now();
    (function frame(now) {
      const t = (now - t0) / 1000;
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of P) {
        const tt = t - p.d; if (tt <= 0) continue;
        const y = (-20 + tt * p.v * innerHeight * .55) * devicePixelRatio;
        const x = (p.x * innerWidth + Math.sin(tt * p.w) * 18 + p.dr * tt) * devicePixelRatio;
        ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, 3.2 - tt)); ctx.translate(x, y); ctx.rotate(tt * p.s);
        ctx.fillStyle = p.c; ctx.fillRect(-4 * devicePixelRatio, -6 * devicePixelRatio, 8 * devicePixelRatio, 12 * devicePixelRatio); ctx.restore();
      }
      if (t < 4) requestAnimationFrame(frame); else c.hidden = true;
    })(t0);
  }

  // ---------- Home ----------
  function home() {
    game = null;
    const e = estimate();
    const daily = S.daily[today()];
    let hero;
    if (!bank) {
      hero = `<section class="hero loading"><span class="eyebrow">Lexicomètre</span><h1>Combien de mots connais-tu ?</h1><p>Chargement des 43 315 mots du lexique…</p></section>`;
    } else if (!S.profile) {
      hero = `<section class="hero"><span class="eyebrow">Bienvenue</span><h1>Combien de mots connais-tu ?</h1>
        <p>Un mot s'affiche, choisis sa définition parmi trois. L'algorithme s'adapte à chaque réponse et estime ton vocabulaire parmi les ${fmt(bank.universe)} mots du français courant.</p>
        <p><b>Le français, pour toi, c'est…</b></p>
        <div class="row"><button class="btn white" data-profile="native">Ma langue maternelle</button><button class="btn ghost" data-profile="learner">Une langue que j'apprends</button></div></section>`;
    } else if (e && e.answered >= 10) {
      const t = L.titleFor(e.median);
      hero = `<section class="hero"><span class="eyebrow">Ton vocabulaire</span>
        <div class="big">${fmt(L.roundDisplay(e.median))}<small>mots</small></div>
        <p>${pct(e.median / e.universe)} des ${fmt(e.universe)} mots du français courant</p>
        <div class="chips"><span class="chip">${esc(t.name)}</span><span class="chip">Précision ±${pct(e.precision)}</span></div>
        <div class="row"><button class="btn ghost" data-start="test">Nouveau test</button><button class="btn white" data-start="free">Affiner</button></div></section>`;
    } else {
      hero = `<section class="hero"><span class="eyebrow">Test adaptatif</span><h1>Combien de mots connais-tu ?</h1>
        <p>40 mots, environ 5 minutes. Ton score s'affine ensuite à chaque partie.</p>
        <button class="btn white" data-start="test">Commencer le test</button></section>`;
    }
    const wotd = bank ? wordOfTheDay() : null;
    app.innerHTML = `
      <header class="topbar"><div class="brand"><span class="logo">Aa</span>Lexicomètre</div><span class="pill flame" title="Jours d'affilée">${FLAME}${dayStreak()}</span></header>
      ${hero}
      <div class="section-title">Jouer</div>
      <div class="modes">
        <button class="mode" data-start="daily" ${bank && S.profile ? '' : 'disabled'}><span class="ico g2">${ICONS.cal}</span><span class="txt"><b>Défi du jour</b><span>${daily ? `Fait : ${daily.filter((o) => o === 'correct').length}/10 · voir le résultat` : '10 mots, du plus courant au plus rare'}</span></span>${daily ? '<span class="tag">Fait</span>' : ''}</button>
        <button class="mode" data-start="free" ${bank && S.profile ? '' : 'disabled'}><span class="ico g1">${ICONS.inf}</span><span class="txt"><b>Mode libre</b><span>Des mots à l'infini, ton score s'affine</span></span></button>
        <button class="mode" data-start="chrono" ${bank && S.profile ? '' : 'disabled'}><span class="ico g3">${ICONS.clock}</span><span class="txt"><b>Contre-la-montre</b><span>60 secondes${S.chronoBest ? ' · record ' + S.chronoBest : ', un max de bonnes réponses'}</span></span></button>
      </div>
      ${wotd ? `<section class="card wotd"><div class="head"><b>Mot du jour</b><span class="gram">${esc(L.grammarShort(wotd))}</span></div><div class="headword">${esc(wotd.text)}</div><p>${esc(wotd.def)}</p></section>` : ''}
      <p class="foot">Aperçu web de l'app iOS Lexicomètre · progression gardée dans ce navigateur<br>Définitions : Wiktionnaire (CC BY-SA) · Fréquences : Lexique 3.83 (CC BY-SA)</p>`;
    app.querySelectorAll('[data-profile]').forEach((b) => b.onclick = () => { S.profile = b.dataset.profile; rebuild(); save(); home(); });
    app.querySelectorAll('[data-start]').forEach((b) => b.onclick = () => {
      const m = b.dataset.start;
      if (m === 'daily' && S.daily[today()]) return dailyResult(S.daily[today()]);
      start(m);
    });
  }
  function wordOfTheDay() {
    const rnd = L.seeded('mot-' + today());
    const target = L.difficultyFor(.2 + rnd() * .25);
    const c = L.wordsNear(bank, target, 60).filter((w) => w.ex);
    return c.length ? L.pick(c, rnd) : null;
  }

  // ---------- Game ----------
  let game = null;
  const LENGTH = { test: 40, daily: 10 };
  function start(mode) {
    game = { mode, length: LENGTH[mode] || null, n: 0, streak: 0, best: 0, ok: 0, bad: 0, unk: 0, xp: 0, outcomes: [], missed: [],
             used: new Set(), queue: mode === 'daily' ? L.dailyQuestions(bank, today()) : [], startEst: estimate(), q: null, answered: null,
             deadline: mode === 'chrono' ? Date.now() + 60000 : null, timer: null };
    if (mode === 'chrono') game.timer = setInterval(tick, 100);
    next();
  }
  function pickWord() {
    const g = game, i = g.n;
    let target;
    if (g.mode !== 'chrono' && i % 6 === 5) target = bank.words[0].b + Math.random() * (bank.words[bank.words.length - 1].b - bank.words[0].b);
    else target = est.target(i < 3 ? .8 : g.mode === 'chrono' ? .75 : g.mode === 'free' ? .68 : .62, Math.random);
    const excluded = new Set([...seen, ...g.used]);
    const c = L.wordsNear(bank, target, 8, excluded);
    return c.length ? L.pick(c, Math.random) : L.pick(L.wordsNear(bank, target, 8, g.used), Math.random);
  }
  function next() {
    const g = game;
    if (!g) return;
    if (g.length && g.n >= g.length) return finish();
    g.q = g.queue.length ? g.queue.shift() : L.makeQuestion(bank, pickWord(), Math.random);
    g.used.add(g.q.word.id);
    g.answered = null;
    renderQuiz();
  }
  function answer(choice) {
    const g = game;
    if (!g || g.answered) return;
    if (g.deadline && Date.now() >= g.deadline) return finish();
    const q = g.q, w = q.word;
    const outcome = choice === null ? 'unknown' : choice === q.correct ? 'correct' : 'wrong';
    const wasSeen = seen.has(w.id);
    seen.add(w.id); S.seen = [...seen];
    touchDay();
    if (outcome === 'correct') {
      g.streak++; g.ok++;
      const mult = g.streak >= 10 ? 3 : g.streak >= 6 ? 2 : g.streak >= 3 ? 1.5 : 1;
      g.gain = Math.round((5 + Math.round((1 - L.popularity(w)) * 30)) * mult);
      g.xp += g.gain; S.xp += g.gain;
    } else {
      g.gain = 0;
      if (outcome === 'wrong') { g.streak = 0; g.bad++; } else g.unk++;
      g.missed.push(w);
    }
    g.best = Math.max(g.best, g.streak);
    if (g.best > S.bestStreak) { S.bestStreak = g.best; if ([10, 25, 50].includes(g.best)) toast(`Série record : ${g.best} bonnes réponses d'affilée !`); }
    g.n++; g.outcomes.push(outcome);
    const counts = g.mode === 'test' || g.mode === 'free' || (g.mode === 'daily' && !wasSeen);
    if (counts) { S.responses.push([w.b, outcome]); est.add(w.b, outcome); }
    save();
    g.answered = { outcome, choice };
    renderQuiz();
    if (g.mode === 'chrono') setTimeout(() => { if (game === g && g.answered) next(); }, 450);
  }
  function tick() {
    const g = game;
    if (!g || !g.deadline) return;
    const left = Math.max(0, g.deadline - Date.now());
    const bar = document.getElementById('timebar'), lab = document.getElementById('timelabel');
    if (bar) bar.style.width = (left / 600) + '%';
    if (lab) lab.textContent = Math.ceil(left / 1000) + ' s';
    if (left <= 0) finish();
  }
  function renderQuiz() {
    const g = game, q = g.q, w = q.word, a = g.answered;
    const e = estimate();
    const pop = L.popularity(w);
    const level = pop >= .9 ? 1 : pop >= .7 ? 2 : pop >= .5 ? 3 : pop >= .25 ? 4 : 5;
    const rarity = ['Très courant', 'Courant', 'Soutenu', 'Rare', 'Très rare'][level - 1];
    let progress;
    if (g.mode === 'chrono') progress = `<div class="track hot"><i id="timebar" style="width:${Math.max(0, g.deadline - Date.now()) / 600}%"></i></div><span id="timelabel">${Math.ceil(Math.max(0, g.deadline - Date.now()) / 1000)} s</span>`;
    else if (g.length) progress = `<div class="track"><i style="width:${g.n / g.length * 100}%"></i></div><span>${Math.min(g.n + (a ? 0 : 1), g.length)}/${g.length}</span>`;
    else progress = `<span class="muted">Mode libre · ${g.n} mot${g.n > 1 ? 's' : ''}</span>`;
    const live = (g.mode === 'test' || g.mode === 'free') && e && e.answered >= 5
      ? `<span class="pill soft live">≈ ${fmt(L.roundDisplay(e.median))} mots · ±${pct(e.precision)}${g.startEst && g.startEst.answered >= 10 && L.roundDisplay(e.median) !== L.roundDisplay(g.startEst.median) ? ' · ' + (e.median > g.startEst.median ? '+' : '−') + fmt(Math.abs(L.roundDisplay(e.median) - L.roundDisplay(g.startEst.median))) : ''}</span>` : '';
    const nextBtn = `<button class="btn primary next-btn" id="next">${g.length && g.n >= g.length ? 'Voir le résultat' : 'Suivant'}<span aria-hidden="true"> →</span></button>`;
    const opts = q.options.map((d, i) => {
      let cls = 'opt';
      if (a) cls += i === q.correct ? ' good' : i === a.choice ? ' bad' : ' dim';
      const option = `<button class="${cls}" data-i="${i}" ${a ? 'tabindex="-1"' : ''}><span class="l">${'ABC'[i]}</span><span class="d">${esc(d)}</span></button>`;
      // the thumb is on this definition: "Suivant" appears right below it
      return option + (a && g.mode !== 'chrono' && a.choice === i ? nextBtn : '');
    }).join('');
    const hint = '<p class="hint">Ne devine pas : « Je ne sais pas » affine l\u2019estimation et ne casse pas ta série.</p>';
    let bottom = '';
    if (!a) bottom = `${hint}<button class="btn secondary" id="idk">Je ne sais pas</button>`;
    else if (g.mode === 'chrono') bottom = `${hint}<button class="btn secondary" disabled>Je ne sais pas</button>`;
    else if (a.choice === null) bottom = '<p class="hint">Prends le temps de lire la réponse.</p>' + nextBtn;
    let feedback = '';
    if (a && g.mode !== 'chrono') {
      const title = a.outcome === 'correct' ? (g.streak >= 3 ? `Série de ${g.streak} !` : ['Bravo !', 'Exact !', 'Bien vu !', 'Parfait !'][g.n % 4]) : a.outcome === 'wrong' ? 'Raté !' : 'Voici la réponse';
      const color = a.outcome === 'correct' ? 'var(--good)' : a.outcome === 'wrong' ? 'var(--bad)' : 'var(--flame)';
      const msg = a.outcome === 'correct' && pop < .5 ? `Seuls ${pct(pop)} des francophones connaissent ce mot.` : `Mot connu par environ ${pct(pop)} des francophones.`;
      feedback = `<section class="card feedback"><div class="t"><span class="dot" style="background:${color}"></span>${title}${g.gain ? `<span class="xp">+${g.gain} XP</span>` : ''}</div>
        <p class="m">${msg}</p>${a.outcome !== 'correct' && w.ex ? `<p class="ex">${md(w.ex)}</p>` : ''}</section>`;
    }
    app.innerHTML = `
      <div class="quizbar"><button class="iconbtn" id="quit" aria-label="Quitter">${ICONS.close}</button><div class="progress">${progress}</div><span class="pill flame">${FLAME}${g.streak}</span></div>
      ${live}
      <section class="entry" aria-live="polite"><span class="headword">${esc(w.text)}</span><span class="gram">${esc(L.grammarLong(w))}</span>
        <span class="rarity"><span>${[1, 2, 3, 4, 5].map((k) => `<i class="${k <= level ? 'on' : ''}"></i>`).join('')}</span>${rarity}</span></section>
      <div class="options">${opts}</div>
      ${feedback}
      ${bottom ? `<div class="bottom">${bottom}</div>` : ''}`;
    app.querySelectorAll('.opt').forEach((b) => b.onclick = () => answer(+b.dataset.i));
    const idk = document.getElementById('idk'); if (idk) idk.onclick = () => answer(null);
    const nx = document.getElementById('next'); if (nx) nx.onclick = next;
    document.getElementById('quit').onclick = () => (g.n ? finish() : (stopTimer(), home()));
  }
  function stopTimer() { if (game && game.timer) { clearInterval(game.timer); game.timer = null; } }
  document.addEventListener('keydown', (ev) => {
    if (!game || !game.q || game.done) return;
    const k = ev.key.toLowerCase();
    if (!game.answered && ['1', '2', '3', 'a', 'b', 'c'].includes(k)) answer('123'.includes(k) ? +k - 1 : 'abc'.indexOf(k));
    else if (!game.answered && (k === '0' || k === '?')) answer(null);
    else if (game.answered && (k === 'enter' || k === ' ')) { ev.preventDefault(); next(); }
  });

  // ---------- Results ----------
  function finish() {
    const g = game;
    if (!g || g.done) return;
    g.done = true; stopTimer();
    if (g.mode === 'chrono') { g.record = g.ok > S.chronoBest; S.chronoBest = Math.max(S.chronoBest, g.ok); }
    if (g.mode === 'daily' && g.n >= 10 && !S.daily[today()]) S.daily[today()] = g.outcomes;
    save();
    if (g.mode === 'daily') return g.n >= 10 ? dailyResult(g.outcomes, g) : home();
    renderResult(g);
  }
  function statsBlock(g) {
    return `<div class="stats">
      <div class="stat"><b style="color:var(--good)">${g.ok}</b><span>justes</span></div>
      <div class="stat"><b style="color:var(--bad)">${g.bad}</b><span>erreurs</span></div>
      <div class="stat"><b>${g.unk}</b><span>je ne sais pas</span></div>
      <div class="stat"><b style="color:var(--flame)">${g.best}</b><span>meilleure série</span></div>
      <div class="stat"><b>+${g.xp}</b><span>XP gagnés</span></div>
      <div class="stat"><b>${Math.floor(Math.sqrt(S.xp / 60)) + 1}</b><span>niveau</span></div></div>`;
  }
  function missedBlock(g) {
    if (!g.missed.length) return '';
    return `<section class="card"><div class="section-title" style="margin:0 0 10px">À retenir</div><div class="missed">${g.missed.slice(0, 12).map((w) =>
      `<div><span class="headword">${esc(w.text)}</span> <span class="gram">${esc(L.grammarShort(w))}</span><p>${esc(w.def)}</p></div>`).join('')}</div></section>`;
  }
  function chartSVG() {
    const n = 48, W = 320, H = 170, pl = 34, pb = 22, pt = 8, pr = 8;
    const idx = Array.from({ length: n }, (_, i) => Math.round(i * (bank.words.length - 1) / (n - 1)));
    const ws = idx.map((i) => bank.words[i]);
    const you = est.knowledge(ws.map((w) => w.b));
    const X = (r) => pl + (r / bank.universe) * (W - pl - pr), Y = (p) => pt + (1 - p) * (H - pt - pb);
    const line = (vals) => vals.map((v, i) => (i ? 'L' : 'M') + X(ws[i].id).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    let grid = '';
    for (const p of [0, .25, .5, .75, 1]) grid += `<line x1="${pl}" x2="${W - pr}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(p) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${p * 100} %</text>`;
    for (const r of [0, 10000, 20000, 30000, 40000]) grid += `<text x="${X(r)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${r ? r / 1000 + ' k' : '0'}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Probabilité de connaître un mot selon son rang">${grid}
      <path d="${line(ws.map((w) => L.popularity(w)))}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
      <path d="${line(you)}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>`;
  }
  function renderResult(g) {
    const e = estimate();
    let top;
    if (g.mode === 'chrono') {
      top = `<section class="hero result-hero"><span class="eyebrow">Contre-la-montre</span><div class="big">${g.ok}</div><p>bonne${g.ok > 1 ? 's' : ''} réponse${g.ok > 1 ? 's' : ''} en 60 secondes</p><span class="chip">${g.record && g.ok ? 'Nouveau record !' : 'Record : ' + S.chronoBest}</span></section>`;
    } else if (e && e.answered >= 5) {
      const t = L.titleFor(e.median);
      const v = L.roundDisplay(e.median);
      const delta = g.startEst && g.startEst.answered >= 10 ? v - L.roundDisplay(g.startEst.median) : 0;
      top = `<section class="hero result-hero"><span class="eyebrow">${g.mode === 'test' ? 'Résultat du test' : 'Ton estimation'}</span><p>Tu connais environ</p>
          <div class="big" id="count">0</div><p><b>mots de français</b></p>
          <span class="interval">entre ${fmt(L.roundDisplay(e.low))} et ${fmt(L.roundDisplay(e.high))} (80 % de confiance)</span>
          ${delta ? `<span class="chip">${delta > 0 ? '+' : '−'}${fmt(Math.abs(delta))} depuis le début de la partie</span>` : ''}</section>
        <section class="card titlecard"><span class="medal">${esc(t.name[0])}</span><div><b>${esc(t.name)}</b><span>${esc(t.blurb)}</span></div></section>
        <section class="card ringrow">${ring(e.median / e.universe)}<div><b>du lexique français</b><p class="muted" style="margin:4px 0 0">${fmt(v)} mots sur les ${fmt(e.universe)} de notre lexique de référence.</p></div></section>
        <section class="card bench"><div class="section-title" style="margin:0 0 6px">Repères</div>
          <div class="scale"><div class="base"></div><div class="fill" style="width:${Math.min(100, e.median / e.universe * 100)}%"></div>
          ${L.BENCHMARKS.map(([, b]) => `<div class="tick" style="left:${b / e.universe * 100}%"></div>`).join('')}<div class="you" style="left:${Math.min(100, e.median / e.universe * 100)}%"></div></div>
          ${L.BENCHMARKS.map(([lab, b]) => `<div class="b ${e.median >= b ? 'ok' : ''}"><span><span class="check">${e.median >= b ? '✓' : ''}</span>${lab}</span><span>≈ ${fmt(b)}</span></div>`).join('')}
          <p class="muted" style="font-size:12px;margin:4px 0 0">Repères indicatifs, sur la même échelle que ton score.</p></section>
        <section class="card chart"><div class="section-title" style="margin:0 0 8px">Ta connaissance selon la rareté des mots</div>${chartSVG()}
          <div class="legend"><span><i style="background:var(--accent)"></i>Toi</span><span><i style="background:var(--muted)"></i>Francophone moyen</span></div></section>
        <button class="btn secondary" id="copy">Copier mon score</button>`;
    } else {
      top = `<section class="card center"><b>Encore quelques mots</b><p class="muted">Réponds à quelques questions de plus pour obtenir une estimation.</p></section>`;
    }
    app.innerHTML = `${top}${statsBlock(g)}${missedBlock(g)}<button class="btn primary" id="home">Terminer</button>`;
    document.getElementById('home').onclick = home;
    const copy = document.getElementById('copy');
    if (copy && e) copy.onclick = () => copyText(`Je connais environ ${fmt(L.roundDisplay(e.median))} mots de français d'après le Lexicomètre (${L.titleFor(e.median).name}). Et toi ?`);
    const count = document.getElementById('count');
    if (count && e) countUp(count, L.roundDisplay(e.median));
    if ((g.mode === 'test' && g.n >= 40) || (g.mode === 'chrono' && g.record && g.ok)) confetti();
  }
  function ring(share) {
    const r = 34, c = 2 * Math.PI * r;
    return `<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * share).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>
      <text x="42" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${pct(share)}</text></svg>`;
  }
  function countUp(el, target) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(target); return; }
    const t0 = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - t0) / 1600), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(Math.round(target * eased / 10) * 10);
      if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(target);
    })(t0);
  }
  function copyText(text) {
    const done = () => toast('Copié : colle-le où tu veux');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast(text));
    else toast(text);
  }
  function dailyResult(outcomes, g) {
    const score = outcomes.filter((o) => o === 'correct').length;
    const grid = outcomes.map((o) => (o === 'correct' ? '🟩' : o === 'wrong' ? '🟥' : '⬜️')).join('');
    const comment = score === 10 ? 'Parfait ! Un sans-faute.' : score >= 8 ? 'Superbe score !' : score >= 6 ? 'Très bien joué.' : score >= 4 ? 'Pas mal du tout.' : 'Les mots rares se méritent !';
    const date = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    app.innerHTML = `<section class="hero result-hero"><span class="eyebrow">Défi du jour · ${esc(date)}</span><div class="big">${score}/10</div><div class="grid10">${grid}</div><p><b>${comment}</b></p></section>
      <button class="btn secondary" id="copy">Copier mon résultat</button>
      <p class="center muted" id="countdown"></p>
      ${g ? statsBlock(g) + missedBlock(g) : ''}
      <button class="btn primary" id="home">Accueil</button>`;
    document.getElementById('home').onclick = home;
    document.getElementById('copy').onclick = () => copyText(`Lexicomètre · Défi du ${date}\n${grid}\n${score}/10`);
    const cd = document.getElementById('countdown');
    const upd = () => {
      if (!document.body.contains(cd)) return clearInterval(iv);
      const m = new Date(); m.setHours(24, 0, 0, 0);
      const s = Math.max(0, Math.floor((m - Date.now()) / 1000));
      cd.textContent = `Prochain défi dans ${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };
    const iv = setInterval(upd, 1000); upd();
    if (g && score >= 8) confetti();
  }

  // ---------- Boot ----------
  home();
  fetch('mots.txt').then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); }).then((text) => {
    bank = L.parseBank(text);
    rebuild();
    if (!game) home();
  }).catch(() => {
    app.querySelector('.hero p').textContent = 'Le lexique n’a pas pu être chargé. Recharge la page pour réessayer.';
  });
})();
</script>
